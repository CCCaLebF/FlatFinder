{% load static flatfinder %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FlatFinder{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // The palette lives here: templates use `brand-*` and `accent-*`, never raw colour names,
    // so restyling the whole app means changing these values only.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#f0fdfa", 100: "#ccfbf1", 200: "#99f6e4", 300: "#5eead4", 400: "#2dd4bf",
              500: "#14b8a6", 600: "#0d9488", 700: "#0f766e", 800: "#115e59", 900: "#134e4a",
            },
            accent: { 400: "#4ade80", 500: "#22c55e", 600: "#16a34a" },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  {{ map_config|json_script:"map-config" }}
  {% block head %}{% endblock %}
</head>
<body class="flex h-full flex-col bg-slate-50 text-slate-800">
  {% include "core/partials/header.html" %}
  <div class="flex min-h-0 flex-1">
    {% block body %}{% endblock %}
  </div>
  <script src="{% static 'core/js/mapstate.js' %}"></script>
  <script src="{% static 'core/js/bookmarks.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
