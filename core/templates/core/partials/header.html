{% load flatfinder %}
<header class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-5">
  <a href="{% url 'core:start' %}" class="flex items-center gap-2 text-lg font-bold text-brand-700">
    <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand-600 text-white">F</span>
    FlatFinder
  </a>
  <nav class="flex items-center gap-4">
    <div class="inline-flex rounded-lg bg-slate-100 p-1 text-sm" role="group" aria-label="View mode">
      <a href="{% url_replace view='list' page=None %}" data-view="list"
         class="rounded-md px-3 py-1 {% if view_mode != 'map' %}bg-white font-medium text-brand-700 shadow{% else %}text-slate-600{% endif %}">List View</a>
      <a href="{% url_replace view='map' page=None %}" data-view="map"
         class="rounded-md px-3 py-1 {% if view_mode == 'map' %}bg-white font-medium text-brand-700 shadow{% else %}text-slate-600{% endif %}">Map View</a>
    </div>
    <a href="{% url 'core:saved' %}" class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-brand-50 hover:text-brand-700">
      Saved (<span id="saved-count">{{ saved_count }}</span>)
    </a>
  </nav>
</header>
