{% load flatfinder %}
<header class="grid h-14 shrink-0 grid-cols-[1fr_auto_1fr] items-center border-b border-slate-200 bg-white px-5">
  <a href="{% url 'core:start' %}" class="flex items-center gap-2 justify-self-start text-lg font-bold text-slate-900">
    <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand-600 text-white">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 3 10v10.2a.8.8 0 0 0 .8.8H9v-6h6v6h5.2a.8.8 0 0 0 .8-.8V10z"/></svg>
    </span>
    FlatFinder
  </a>
  <nav class="inline-flex rounded-full border border-slate-200 bg-slate-50 p-1 text-sm" aria-label="View mode">
    <a href="{% url_replace view='list' page=None %}" data-view="list" {% if view_mode != 'map' %}aria-current="page"{% endif %}
       class="flex items-center gap-1.5 rounded-full px-3.5 py-1 {% if view_mode != 'map' %}bg-white font-semibold text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      List View
    </a>
    <a href="{% url_replace view='map' page=None %}" data-view="map" {% if view_mode == 'map' %}aria-current="page"{% endif %}
       class="flex items-center gap-1.5 rounded-full px-3.5 py-1 {% if view_mode == 'map' %}bg-white font-semibold text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 4-6 2.5v14L9 18l6 2.5 6-2.5v-14L15 6.5zM9 4v14M15 6.5v14"/></svg>
      Map View
    </a>
  </nav>
  <a href="{% url 'core:saved' %}" class="flex items-center gap-1.5 justify-self-end rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-brand-50 hover:text-brand-700">
    <svg class="h-4 w-4 text-brand-600" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
    <span>Saved (<span id="saved-count">{{ saved_count }}</span>)</span>
  </a>
</header>
